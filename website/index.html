<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <meta name="description" content="A multi-purpose calculator app available in 15 languages.">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5b6470;
      --accent: #2f6fec;
      --border: #e2e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1e24;
        --text: #e8ebef;
        --muted: #9aa4b1;
        --accent: #6c9dff;
        --border: #2a3039;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 4px 0; }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Calculator</h1>
      <p class="sub">A multi-purpose calculator in 15 languages</p>
      <ul>
        <li>Basic and scientific calculator with history</li>
        <li>Unit converter</li>
        <li>Percentage, discount, tip and bill splitting</li>
        <li>Loan payment schedule</li>
        <li>Date difference and adding days to a date</li>
        <li>Body mass index</li>
      </ul>
    </div>
    <footer>
      <a href="/app-ads.txt">app-ads.txt</a>
    </footer>
  </main>
</body>
</html>
